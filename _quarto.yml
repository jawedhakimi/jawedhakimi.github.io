project:
  type: website
  output-dir: docs

website:
  title: "The Bench Notebook"
  site-url: "https://jawedhakimi.github.io"
  navbar: false
  sidebar:
    style: docked
    background: light
    search: true
    contents:
      - index.qmd
      - section: "Electrical engineering basics"
        contents:
          - electrical-engineering/index.qmd
          - electrical-engineering/ohms-law.qmd
          - electrical-engineering/series-parallel-resistance.qmd
          - electrical-engineering/voltage-divider.qmd
          - electrical-engineering/rc-time-constant.qmd
          - electrical-engineering/ac-impedance.qmd
      - section: "Magnetics"
        contents:
          - magnetics/solenoid.qmd
      - section: "Integrated circuits"
        contents:
          - integrated-circuits/index.qmd
      - section: "Microcontrollers"
        contents:
          - microcontrollers/index.qmd
      - section: "Software"
        contents:
          - software/index.qmd

format:
  html:
    theme: [cosmo, custom.scss]
    css: assets/css/styles.css
    toc: true
    number-sections: false
    smooth-scroll: true
    grid:
      sidebar-width: 220px
      body-width: 760px
      margin-width: 200px
